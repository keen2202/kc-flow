apiVersion: v1
kind: Service
metadata:
  name: workflow-api
  namespace: workflow-engine
  labels:
    app: workflow-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: workflow-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workflow-api-ingress
  namespace: workflow-engine
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: workflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workflow-api
                port:
                  number: 80
  tls:
    - hosts:
        - workflow.example.com
      secretName: workflow-tls
