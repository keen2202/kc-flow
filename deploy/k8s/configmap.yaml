apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-config
  namespace: workflow-engine
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_PREFIX: "/api/v1"
  WORKFLOW_TIMEOUT_SECONDS: "1800"
  NODE_TIMEOUT_SECONDS: "300"
  MAX_PARALLEL_WORKERS: "8"
  CHECKPOINT_ENABLED: "true"
  SANDBOX_ENABLED: "true"
