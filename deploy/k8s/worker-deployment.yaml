apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
  namespace: workflow-engine
  labels:
    app: workflow-worker
    component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workflow-worker
  template:
    metadata:
      labels:
        app: workflow-worker
        component: worker
    spec:
      containers:
        - name: worker
          image: workflow-engine:latest
          command: ["celery", "-A", "src.tasks", "worker", "--loglevel=info", "--concurrency=4"]
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
